name: Validate PTI JavaScript

on:
  push:
    branches: [main, refactor/core-modules-test-20261022, codex/project5-drive-module-package]
  pull_request:
    branches: [main, refactor/core-modules-test-20261022, codex/project5-drive-module-package]
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check embedded JavaScript in index.html
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('Không tìm thấy <script> trong index.html');
          let checked = 0;
          for (const [index, match] of scripts.entries()) {
            const [, attrs, source] = match;
            if (/\bsrc\s*=/i.test(attrs) || !source.trim()) continue;
            if (/^\s*async\s*$/m.test(source)) {
              throw new Error('Có token async đứng riêng trong script số ' + (index + 1));
            }
            new Function(source);
            checked++;
          }
          if (!checked) throw new Error('Không có script nội bộ nào được kiểm tra');
          console.log('PTI inline JavaScript syntax: OK (' + checked + ' scripts)');
          NODE
      - name: Check PTI admin JavaScript
        run: node --check admin-gdv/admin-gdv.js

      - name: Check PTI case-Drive isolation contract
        if: github.ref_name == 'refactor/core-modules-test-20261022' || github.ref_name == 'codex/project5-drive-module-package' || github.head_ref == 'refactor/core-modules-test-20261022' || github.head_ref == 'codex/project5-drive-module-package'
        run: node tests/source-contract.test.js

      - name: Test shared GĐV search Core module
        if: github.ref_name == 'refactor/core-modules-test-20261022' || github.ref_name == 'codex/project5-drive-module-package' || github.head_ref == 'refactor/core-modules-test-20261022' || github.head_ref == 'codex/project5-drive-module-package'
        run: node tests/gdv-search.test.js

      - name: Test local draft storage Core module
        if: github.ref_name == 'refactor/core-modules-test-20261022' || github.ref_name == 'codex/project5-drive-module-package' || github.head_ref == 'refactor/core-modules-test-20261022' || github.head_ref == 'codex/project5-drive-module-package'
        run: node --test tests/local-draft-storage.test.js

      - name: Test shared image layout Core module
        if: github.ref_name == 'refactor/core-modules-test-20261022' || github.ref_name == 'codex/project5-drive-module-package' || github.head_ref == 'refactor/core-modules-test-20261022' || github.head_ref == 'codex/project5-drive-module-package'
        run: node --test tests/image-layout.test.js

      - name: Test shared image collection Core module
        if: github.ref_name == 'refactor/core-modules-test-20261022' || github.ref_name == 'codex/project5-drive-module-package' || github.head_ref == 'refactor/core-modules-test-20261022' || github.head_ref == 'codex/project5-drive-module-package'
        run: node --test tests/image-collection.test.js

      - name: Test 093 Drive storage module package
        if: github.ref_name == 'codex/project5-drive-module-package' || github.head_ref == 'codex/project5-drive-module-package'
        run: node --test modules/drive-storage-093/drive-storage-093.test.js
